# capped-video-mcp 기본 설정 (패키지에 들어간다)
# 바꾸려면 이 파일을 고치지 말고 데이터 폴더(CAPPED_VIDEO_HOME)의 config.toml 에 바꿀 항목만 쓰거나
# CAPPED_VIDEO_* 환경 변수를 쓴다. README 의 "설정" 참고.
# 값이 잘못되면 서버가 뜨지 않는다 (조용히 기본값으로 넘어가지 않는다).

[defaults]
model = "seedance-2.5"
resolution = "480p"           # 모델에 없으면 그 모델의 가장 낮은 해상도
duration_sec = 5              # 모델이 허용하지 않으면 모델 기본값 또는 가장 짧은 길이
aspect_ratio = "16:9"

[limits]
max_resolution = "768p"       # 이보다 높은 해상도는 거부 (768p 는 Hailuo 고정 해상도. 1080p·4k 는 거부)
max_duration_sec = 10         # 모델별 길이와 둘 중 작은 값 적용
daily_max_count = 10          # 하루 생성 횟수 (한국 시간 기준)
daily_max_usd = 5.0           # 하루 예상 비용 합계 상한
monthly_max_usd = 30.0        # 한 달 예상 비용 합계 상한
max_pending_jobs = 3          # 동시에 진행 중인 작업 수 상한
max_wait_seconds = 60         # get_video_status 대기 상한
job_timeout_minutes = 60      # 원격이 이 시간이 지나도 끝나지 않으면 취소하고 실패 처리
download_retry_minutes = 50   # 원격 완료 후 다운로드 재시도 기한 (Replicate 는 완료 1시간 뒤 결과 삭제)
poll_interval_sec = 10        # 백그라운드 수거 주기
max_prompt_chars = 2000
duplicate_window_minutes = 10 # 이 시간 안에 같은 요청(프롬프트·모델·해상도·길이·비율)이 다시 오면 새 작업을 만들지 않고
                              # 기존 job_id 를 돌려준다 (에이전트 재시도로 인한 이중 과금 방지). 0 이면 끈다
confirm_above_usd = 0         # 예상 비용이 이 값 이상이면 생성 전에 서버가 사용자에게 직접 확인을 요청한다 (MCP elicitation).
                              # 클라이언트 승인 설정과 무관하게 동작한다. 0 이면 묻지 않는다
confirm_fallback = "allow"    # 클라이언트가 확인 요청을 지원하지 않을 때: allow(그냥 진행) | deny(거부)
failover = true               # 1차 제공처가 요청을 확정 거부하면 모델의 fallback_model 로 다시 시도한다.
                              # 결과를 모르는 오류(타임아웃·5xx)에서는 전환하지 않는다 (이중 과금 방지)

aspect_ratios = ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9"]

[preview]
ffmpeg = ""                   # ffmpeg 실행 파일 경로. 비우면 PATH 에서 찾는다. 없으면 preview_video 가 이유를 돌려준다
frames = 6                    # 미리보기에 넣을 프레임 수 (가로 3장씩)
frame_width = 320             # 프레임 한 장의 가로 픽셀

[download]
dir = "output"
max_bytes = 524_288_000       # 500MB
# 영상 URL 허용 도메인. 정확히 같거나 그 하위 도메인만 허용한다.
# 실제 도메인은 작업진행.md 의 "실제 API 검증" 단계에서 확인해 고친다.
allowed_hosts = [
  "replicate.delivery",       # Replicate 결과 파일 (추정, 검증 필요)
  "fal.media",                # fal CDN. Veo 3.1 문서 예시 응답이 v3b.fal.media 였다
  # 다른 fal 모델 문서 예시는 storage.googleapis.com 이었다. 모든 GCS 버킷을 허용하게 되므로
  # 실제 응답에서 확인되기 전에는 넣지 않는다.
]

# ── 모델 허용 목록 ──
# alias: 에이전트가 쓰는 이름
# 길이: min/max_duration_sec(연속 범위) 또는 durations(정해진 값) 중 하나
# 가격: price_per_sec(해상도별 초당) 또는 price_per_clip(해상도별 → 길이별 한 편당) 중 하나
# input: 요청 본문 형식
#   duration_format = "int"(5) | "str"("5") | "str_s"("5s")
#   send_resolution / send_aspect_ratio = 입력 필드가 없는 모델은 false
#   generate_audio = 보낼 값 (없으면 보내지 않음). 가격표는 이 값 기준이어야 한다
# 모든 가격은 USD, 확인일은 price_checked.

[[models]]
alias = "seedance-2.5"
provider = "replicate"
model_ref = "bytedance/seedance-2.5"
note = "ByteDance Seedance 2.5 (Replicate). 기본 모델. 소리 포함"
fallback_model = "seedance-2.5-fal"   # Replicate 가 확정 거부하면 fal 로
min_duration_sec = 4
max_duration_sec = 10
# Replicate 공시가 $0.1028/$0.2312 per output second (2026-11-22, 독립된 비교 글 2곳이 동일하게 인용. 실제 청구액은 미확인)
price_per_sec = { "480p" = 0.1028, "720p" = 0.2312 }
price_checked = "2026-11-22"
input = { duration_format = "int", generate_audio = true }

[[models]]
alias = "seedance-2.5-fal"
provider = "fal"
model_ref = "bytedance/seedance-2.5/text-to-video"
note = "ByteDance Seedance 2.5 (fal). Replicate 보다 약 2배 비쌈"
fallback_model = "seedance-2.5"
min_duration_sec = 4
max_duration_sec = 10
price_per_sec = { "480p" = 0.2205, "720p" = 0.4730 }
